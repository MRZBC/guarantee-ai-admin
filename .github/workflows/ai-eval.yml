# =============================================================================
# AI 评测 CI（ai-eval）
#
# ⚠️ 真实状态（必读）：
#   【首跑 + 修复 + 本地复演全绿：2026-10-08（手动触发）】
#   首跑：**Job1 在 guarantee-system 红了**（120 用例中 3 failures + 41 errors），
#   Job2/Job3 因 `needs: build-and-it` 被跳过。用"空库"在本机复现，报错与 CI 逐字一致
#   （surefire 3.5.6 / "There are test failures." / MojoFailureException）。
#   四处根因与修复：
#     ① 空库没有演示数据：Job1 只起 MySQL/Redis service，**从不启动 guarantee-web** →
#        DataInitializer（默认 true）不执行。而 system / analysis / web 的 *IT 全按"演示库"写
#        （21 机构 / 单棵 11 部门树 / 300 用户 / 角色权限矩阵 / 15 万订单）。
#        修法：新增 **scripts/ci-seed-demo-data.sh**（打包好的后端起一次 → 等
#        "演示数据初始化完成" → 以**库里可见状态**为准 → 断言形状 21/11/1/300 + 订单数 → 停），
#        Job1 与 Job2 **共用同一份脚本**；实测种子自身 6.0s、含启动约 15s。
#     ② schema 漂移：`sys_user.account_type` 只加在 db/migration/V10，schema.sql 没有
#        → 空库缺列，SysUserAccountTypeIntegrationTest 6/6 报 BadSqlGrammar。
#        修法：补进 schema.sql（DDL 与 V10 的 ADD COLUMN 逐字一致）。
#     ③ 新库的演示数据与测试目标态不一致：DataInitializer 产出 **21 棵**部门树
#        （231 部门 / 21 个 parent_id=0 的根），而 DataScopeIntegrationTest 与
#        scripts/verify-dept-tree-shape.mjs 都要求"**单棵纯部门树**（11 部门 / 唯一根「总部」）"。
#        本地能绿是因为开发库早已用手工迁移（migrate-dept-single-org）收敛过 →
#        **新库/新同事/CI 都是坏的**。修法：**对齐 DataInitializer**（单棵树、部门 id 从 1001 起、
#        用户按序号轮转，与已执行迁移同形）。该残留项此前在 docs/PLAN-部门配置树形改造方案.md
#        §16.3 被显式记录为"应单独决策"，本次即该决策（§16.3 已同步为"已闭环"）。
#     ④（测试侧）OperationAuditAllLimitIT 原来要求"库里近 7 天审计 > 200 条"——审计行是
#        **运行时**产物（DataInitializer 不造），干净库只有 14 条 → 它测不到 all/limit 的差异。
#        修法：用例自建 250 条夹具、用例后按 trace_id 删除（断言口径不变）。
#
#   修复后**本地干净库复演**（等同本文件 Job1 的序列）：
#     全新建空库 → `mvn -pl guarantee-web -am -DskipTests package` → 起 jar 播种
#     （16.1s 含启动，种子自身 6.0s）→ 形状 OK（21/11/1/300/100000/50000）→
#     `mvn -B verify` → **8/8 模块 BUILD SUCCESS，合计 753 项用例 0 失败 0 错误**。
#     Job1 的这一步也在本文件里落成了形状断言（见 "起一次后端播种演示数据，并断言形状"）。
#
#   【同日后续两轮】
#     · Job1 第二轮：修好播种后又红了 `AiObservabilityIT`（依赖"别的用例先写过
#       ai_config_item"）与 `PromptVersionLifecycleIT`（门禁桩命令写了 Windows 专有的
#       `cmd /c exit 0`）——两处都是**测试侧**问题，已修（前者改断言口径+会话定位，
#       后者把桩命令换成跨平台的 `java -version`）。
#     · Job2 首跑（第二轮）：12 个用例全红在 `EvaluationDeterministicIT.adminUserId`
#       （`Incorrect result size: expected 1, actual 0`）——根因与 Job1 首跑同源：
#       **Job2 是另一个 runner + 另一个 MySQL 容器**，吃不到 Job1 播的种，而该 IT 自己也
#       显式 `guarantee.data-init.enabled=false`。修法：Job2 也调用
#       scripts/ci-seed-demo-data.sh，并补"等 MySQL/Redis 就绪"一步。
#     · 仍未在 CI 上执行过：**Job3（真机集/拒答）**，其差异仍是按 runner 推断：
#    1) schema 初始化：应用启动时靠 `guarantee-web/src/main/resources/db/schema.sql`
#       自建表（`spring.sql.init.mode=always`）。仓库**没有 Flyway**，
#       `db/migration/V1..V10` 是**手工**执行的幂等脚本 → 新增列/表必须**同时**改
#       schema.sql（空库路径）与 migration（存量路径）；只改一处就是上面 ② 那种漂移。
#    2) live 集的数据基线：真机集要求订单量 ≥1000 且数据区间正确
#       （`GOLDEN_BASELINE_MIN_ORDERS` 默认 1000）。Job3 自己起后端，因此**已经**有
#       15 万订单的演示数据；但"数据区间正确"仍需真机跑一次确认。
#    3) 真机集需要 `secrets.DEEPSEEK_API_KEY`：未配置时该作业**跳过而不是失败**。
#
# 三道门（与本地一致）：
#   Job1 `mvn -B verify`      —— 编译 + 单测 + 集成测试（MySQL 8 + Redis service）
#   Job2 确定性集              —— Stub 模型，12 条，**发布门禁的确定性半边**（快、不花钱）
#   Job3 真机集                —— 真模型 + **拒答类多轮（--suite=refusal，默认 3 轮，N 次全通过才算通过）**
#                                进入条件有两条**显式**入口：
#                                  ① 手动触发（可勾 skip_live 跳过）；
#                                  ② **定时触发 + 仓库变量 `EVAL_LIVE_ON_SCHEDULE == 'true'`**（opt-in，默认关）。
#
# 为什么定时跑真机必须 opt-in（默认关闭）：
#   定时任务**无人看管**。真机集会真花钱（DeepSeek 额度）、且依赖订单数据基线——
#   仓库当前**没有订单 seed**，定时跑大概率落在 `environment`（exit 2）长期空转。
#   所以默认"定时只跑 Job1+Job2"，要开的人显式设置仓库变量（见 docs/CI-真机评测.md §3）。
#
# 发布门禁口径（与 docs/TEST-助手黄金问题集.md §5.1 一致）：
#   **确定性集 12/12（Job2） + 拒答类 ×3 全通过（Job3 内的 refusal 步骤）**
#   两个步骤中任一判为"断言失败(exit 1)"即视为模型行为回归 → 作业失败。
#
# 本地等价物：`pwsh scripts/run-live-eval.ps1 -Port 8092`（Windows；本机已实测）。
#   ⚠️ 本机脚本用 Windows API（Get-NetTCPConnection），**不能**直接在 ubuntu runner 上跑；
#      因此 Job3 用 bash 重写了同样的步骤（同样的三条纪律：带 `-am`、
#      禁止 `-Dspring-boot.repackage.skip=true`、绝不碰用户自己的实例端口）。
# =============================================================================

name: ai-eval

on:
  # 手动：可只跑指定题号，便于定位
  workflow_dispatch:
    inputs:
      only:
        description: 'live 集只跑指定题号（逗号分隔，如 GQ-31,GQ-34；留空=全量）'
        required: false
        default: ''
      skip_live:
        description: '仅跑 Job1/Job2（跳过真机集）'
        required: false
        type: boolean
        default: false
  # 每日 02:00 UTC（北京时间 10:00）：默认只跑到 Job2 —— Job3 是真模型、花钱且数据依赖强。
  # 要"定时也跑 live/refusal"，必须**显式**把仓库变量 EVAL_LIVE_ON_SCHEDULE 设为 'true'
  # （Settings → Secrets and variables → Actions → Variables；或 `gh variable set`）。
  # 默认关闭：无人看管时别烧额度、也别长期空转（详见文件头与 docs/CI-真机评测.md §3）。
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

# 应用读取的**数据库/缓存环境变量名**（application.yml 里的占位符就是这些）
env:
  DB_HOST: 127.0.0.1
  DB_PORT: '3306'
  DB_NAME: guarantee_ai_admin
  DB_USER: guarantee
  DB_PASSWORD: 'guarantee@2026'
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: '6379'

jobs:
  # ---------------------------------------------------------------------------
  # Job1：构建 + 单测 + 集成测试
  # ---------------------------------------------------------------------------
  build-and-it:
    name: 构建与集成测试（mvn -B verify）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: guarantee_ai_admin
          MYSQL_USER: guarantee
          MYSQL_PASSWORD: 'guarantee@2026'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 安装 Node 22（评测脚本用）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 等待 MySQL 就绪
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then exit 0; fi
            sleep 2
          done
          echo "MySQL 未在 60s 内就绪" >&2
          exit 1

      # ---------------------------------------------------------------------
      # 演示数据播种（与本地口径**完全一致**；实现收敛在 scripts/ci-seed-demo-data.sh，
      # Job2 也调同一份脚本——不同 job 是不同 runner 与不同 MySQL 容器，不能复用彼此的库）
      #
      # 为什么必须有这一步：guarantee-system / guarantee-analysis / guarantee-web 的 *IT
      # 都是按"演示库"写的（21 机构 / 单棵 11 部门树 / 300 用户 / 角色权限矩阵 / 15 万订单），
      # 且它们自己都显式 `guarantee.data-init.enabled=false`；而在此之前 Job1 只起
      # MySQL/Redis、**从不启动 guarantee-web** → 库是空的 → 首跑 guarantee-system 红了 44 个用例。
      #
      # 纪律：带 -am、禁 repackage.skip、用 8093（绝不碰用户自己的 8081 / Job3 的 8092）；
      # 脚本会等"演示数据初始化完成"、以**库里可见状态**为准（DataInitializer 带 @Transactional，
      # 日志先于提交）、再断言形状（21/11/1/300 + 订单数）。
      # ---------------------------------------------------------------------
      - name: 打包（播种用；带 -am，禁 repackage.skip）
        run: mvn -B -pl guarantee-web -am -DskipTests package

      - name: 起一次后端播种演示数据，并断言形状
        run: bash scripts/ci-seed-demo-data.sh

      - name: mvn -B verify
        run: mvn -B verify

      - name: 上传 surefire/failsafe 报告与播种日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-failsafe-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            ci-seed-app.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Job2：确定性集（发布门禁；Stub 模型，不花钱）
  #   注意：该脚本内部会自己 spawn `mvn -pl guarantee-web -Dit.test=EvaluationDeterministicIT verify`，
  #   所以同样需要 MySQL/Redis 服务，并且**不带** `-am`（脚本的参数是固定的，
  #   它依赖 reactor 里已构建的产物 / 本地仓库；Job1 已 `mvn verify` 过，
  #   这里依赖 Job1 产物不存在（不同 runner），故 Job2 自己再 build 一次）
  # ---------------------------------------------------------------------------
  deterministic-eval:
    name: 确定性黄金问题集（发布门禁）
    runs-on: ubuntu-latest
    needs: build-and-it
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: guarantee_ai_admin
          MYSQL_USER: guarantee
          MYSQL_PASSWORD: 'guarantee@2026'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 等待 MySQL 与 Redis 就绪
        run: |
          mysql_ok=0
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then mysql_ok=1; break; fi
            sleep 2
          done
          if [ "$mysql_ok" != "1" ]; then echo "MySQL 未在 60s 内就绪" >&2; exit 1; fi
          redis_ok=0
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/6379) 2>/dev/null; then redis_ok=1; break; fi
            sleep 2
          done
          if [ "$redis_ok" != "1" ]; then echo "Redis 未在 60s 内就绪" >&2; exit 1; fi
          echo "MySQL / Redis 就绪"

      - name: 先安装依赖模块到本地仓库（保证确定性集用的是本次代码）
        run: mvn -B -DskipTests install

      # ---------------------------------------------------------------------
      # 播种演示数据：EvaluationDeterministicIT 显式 `guarantee.data-init.enabled=false`，
      # 而它要查 admin 用户、按演示数据算 12 道题 → 本作业的库也必须有演示数据，
      # 否则 12 个用例全红在 `adminUserId` 上（2026-10-08 CI 实测：
      # Incorrect result size: expected 1, actual 0）。
      # 本作业与 Job1 是**不同 runner + 不同 MySQL 容器**，不能复用 Job1 的库，
      # 因此调用同一份脚本 scripts/ci-seed-demo-data.sh 再播一次（实测约 15s）。
      # install 已经产出 fat jar，无需再 package。
      # ---------------------------------------------------------------------
      - name: 起一次后端播种演示数据，并断言形状
        run: bash scripts/ci-seed-demo-data.sh

      - name: 确定性集（--suite=deterministic）
        run: node scripts/ai-golden-questions.mjs --suite=deterministic

      - name: 上传确定性集报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-eval-reports
          path: |
            reports/eval-deterministic-*
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Job3：真机集（手动；或定时 + 仓库变量 EVAL_LIVE_ON_SCHEDULE=true；缺 Key 跳过而非失败）
  # ---------------------------------------------------------------------------
  live-eval:
    name: 真机黄金问题集（手动 / 定时 opt-in + 需 DEEPSEEK_API_KEY）
    # 进入条件（两条独立入口，OR）：
    #   ① 手动触发且未勾"跳过 live"；
    #   ② **定时触发** 且仓库变量 EVAL_LIVE_ON_SCHEDULE == 'true'（默认关，避免无人看管烧额度）。
    # 表达式说明：`inputs.skip_live` 只在 workflow_dispatch 下有值，schedule 下为空串；
    # 好在前半段有 `github.event_name == 'workflow_dispatch' &&` 短接，不会误判成"未跳过"。
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.skip_live != true)
      || (github.event_name == 'schedule' && vars.EVAL_LIVE_ON_SCHEDULE == 'true')
    runs-on: ubuntu-latest
    needs: build-and-it
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: guarantee_ai_admin
          MYSQL_USER: guarantee
          MYSQL_PASSWORD: 'guarantee@2026'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      # 🔑 密钥只以环境变量形式进入 runner；**不要**放到命令行参数里（会出现在进程列表）
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ONLY: ${{ inputs.only }}
      # 仅用于日志：这次是不是"定时 + opt-in"进来的（值本身不影响步骤 gating，gating 在 job 的 if）
      EVAL_LIVE_ON_SCHEDULE: ${{ vars.EVAL_LIVE_ON_SCHEDULE }}
    steps:
      - uses: actions/checkout@v4

      - name: 记录触发方式与 opt-in 状态
        run: |
          echo "事件=${{ github.event_name }} / EVAL_LIVE_ON_SCHEDULE=${EVAL_LIVE_ON_SCHEDULE:-<未设置>}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::notice::定时触发的真机集是**显式 opt-in**：仓库变量 EVAL_LIVE_ON_SCHEDULE=true 才会进到这里"
          fi

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 检查是否有 DEEPSEEK_API_KEY
        id: key
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "真机集：未跑（缺 DEEPSEEK_API_KEY）"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "已检测到 DEEPSEEK_API_KEY（值不打印）"
          fi

      - name: 缺 Key：跳过（不判定、不失败）
        if: steps.key.outputs.has_key != 'true'
        run: |
          echo "::notice::真机集未跑：未配置 secrets.DEEPSEEK_API_KEY，跳过 live-eval（不失败）"

      - name: 打包（**带 -am**；**禁止** repackage.skip）
        if: steps.key.outputs.has_key == 'true'
        run: mvn -B -pl guarantee-web -am -DskipTests package

      - name: fat jar 自检（防 thin jar 事故）
        if: steps.key.outputs.has_key == 'true'
        run: |
          JAR=guarantee-web/target/guarantee-ai-admin.jar
          if ! unzip -l "$JAR" | grep -q 'BOOT-INF/'; then
            echo "::error::$JAR 不是 fat jar（BOOT-INF 缺失）——不要传 -Dspring-boot.repackage.skip=true"
            exit 1
          fi
          ls -lh "$JAR"

      - name: 起后端 + 跑真机集（--suite=live）
        if: steps.key.outputs.has_key == 'true'
        run: |
          set -euo pipefail
          JAR=guarantee-web/target/guarantee-ai-admin.jar
          PORT=8092                      # 绝不用 8081（本地约定：那是用户自己的实例）
          java -jar "$JAR" --server.port=$PORT > live-eval-app.log 2>&1 &
          APP_PID=$!
          # 无论后面成功、失败、报错，都必须回收实例
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          up=0
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:$PORT/actuator/health" 2>/dev/null | grep -q '"status":"UP"'; then
              up=1; break
            fi
            sleep 3
          done
          if [ "$up" != "1" ]; then
            echo "::error::后端在 120s 内未就绪（/actuator/health）"
            tail -n 50 live-eval-app.log || true
            exit 1
          fi

          ARGS=""
          if [ -n "${ONLY:-}" ]; then ARGS="--only=$ONLY"; fi
          set +e
          BASE_URL="http://127.0.0.1:$PORT" node scripts/ai-golden-questions.mjs --suite=live $ARGS
          LIVE_CODE=$?
          # A4：拒答类必须**多轮通过**（N 次全通过才算通过；默认 3 轮，见 --suite=refusal）
          BASE_URL="http://127.0.0.1:$PORT" node scripts/ai-golden-questions.mjs --suite=refusal
          REFUSAL_CODE=$?
          set -e
          echo "live 退出码=$LIVE_CODE（0 通过 / 1 断言失败 / 2 环境问题）"
          echo "refusal 退出码=$REFUSAL_CODE（--suite=refusal 默认 3 轮）"

          if [ "$LIVE_CODE" = "1" ] || [ "$REFUSAL_CODE" = "1" ]; then
            echo "::error::真机评测断言失败（模型行为回归：live 或 拒答类多轮）"
            exit 1
          fi
          if [ "$LIVE_CODE" = "2" ] || [ "$REFUSAL_CODE" = "2" ]; then
            # 见文件头第 2 条：CI 目前没有订单 seed，live 集大概率数据不足。
            # 这是**有意**的宽松口径（手动与"定时 opt-in"两种情况都适用）；
            # **接入 seed 之后应改成 exit 1**，否则这道门会长期以"未跑"的姿态空转。
            echo "::warning::真机评测判为 environment（多半是缺数据 seed），按'未跑'处理，本作业不失败"
          fi
          exit 0

      - name: 上传真机集报告与后端日志
        if: always() && steps.key.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-reports
          path: |
            reports/**
            live-eval-app.log
          if-no-files-found: warn

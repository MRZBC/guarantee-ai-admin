server:
  port: 8081
  # SSE 流式对话可能持续较久，放宽异步请求超时
  tomcat:
    connection-timeout: 60s

spring:
  application:
    name: guarantee-ai-admin

  # 同时存在 webflux（为流式提供 Reactor）与 webmvc，这里显式固定为 Servlet 应用
  main:
    web-application-type: servlet

  mvc:
    async:
      request-timeout: 300000

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:guarantee_ai_admin}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USER:guarantee}
    password: ${DB_PASSWORD:guarantee@2026}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      pool-name: guarantee-pool

  # 启动时自动建表（schema.sql 全部使用 CREATE TABLE IF NOT EXISTS，可重复执行）
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      # 基础字典的种子数据（行政区划）。与 schema 一样**每次启动**执行，因此必须幂等：
      # region.sql 用 INSERT IGNORE —— 既不会覆盖人工改动，也不会让已逻辑删除的地区"复活"。
      data-locations: classpath:db/seed/region.sql
      continue-on-error: false
      encoding: UTF-8

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      connect-timeout: 3s

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # ---------------------------------------------------------------------
  # Spring AI 2.0.1 (OpenAI-compatible, 默认 DeepSeek)
  #   注意 2.0 的属性名是 spring.ai.openai.chat.model（1.x 为 chat.options.model）
  # ---------------------------------------------------------------------
  ai:
    openai:
      # 未配置真实 Key 时使用占位值，保证应用可正常启动；
      # 真正调用模型时会返回明确的错误提示而不是启动失败。
      api-key: ${DEEPSEEK_API_KEY:not-configured}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-chat}
        temperature: 0.2

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30
    jdbc-type-for-null: NULL

# ---------------------------------------------------------------------
# 业务配置
# ---------------------------------------------------------------------
guarantee:
  auth:
    jwt:
      # 本地开发默认值。生产环境由 application-prod.yml 覆盖为 ${JWT_SECRET}（无默认值，未设置即启动失败）。
      secret: ${JWT_SECRET:guarantee-ai-admin-local-dev-secret-key-please-change-in-production}
      # 本地开发允许使用内置默认密钥零配置启动；prod profile 下强制为 true（AUTH-03）。
      reject-known-default: false
      # 绝对上限：自登录起算，无论多活跃都不超过。写入 JWT 的 exp。
      # 注意：原名 expire-minutes 已更名，配置旧名会启动失败（见 JwtProperties#setExpireMinutes）
      absolute-expire-minutes: 720
      # 空闲超时（AUTH-04）：Redis 白名单 TTL，有请求即续期。
      # 设为与 absolute-expire-minutes 相同即退化为"固定有效期"（AUTH-04 之前的行为）。
      idle-timeout-minutes: 240
      issuer: guarantee-ai-admin

    # ---------------------------------------------------------------------
    # 登录失败防爆破（AUTH-01）
    #   账号维度：窗口内连续失败达阈值即锁定，文案与"密码错误"可区分。
    #   IP 维度 ：阈值更高，避免 NAT / 办公网出口误伤。
    #   两者均对"不存在的用户名"同样计数——否则"会不会被锁"就成了账号枚举侧信道。
    #
    # 时长用 Duration 语法（15m / 30s 均可），对应 LoginGuardProperties 的
    # failureWindow / userLock / ipLock。**键名写错会启动失败**（该类开了
    # ignoreUnknownFields = false）——曾经写成 *-minutes 导致三个键全部被静默忽略。
    # ---------------------------------------------------------------------
    login-guard:
      enabled: true
      max-failures-per-user: 5
      max-failures-per-ip: 20
      failure-window: 15m
      user-lock: 15m
      ip-lock: 15m
      # 仅在**可信反向代理**之后才可置 true：X-Forwarded-For 可被客户端伪造，
      # 伪造成功即可每次换 IP 绕过 IP 维度（见方案 §4.1.5）。
      trust-forwarded-header: false

    # ---------------------------------------------------------------------
    # 令牌撤销的 Redis 故障策略（AUTH-02）
    #   fail-closed：Redis 不可用时拒绝所有令牌校验（默认，安全优先）
    #   fail-open  ：Redis 不可用时放行（可用性优先，仅限应急，改配置需重启）
    #
    # 注意：Redis 由此成为鉴权链路的**强依赖**。生产部署必须具备哨兵/集群，
    # 且 failure-mode=fail-closed 时必须配套告警（健康检查见 RevocationHealthIndicator）。
    # ---------------------------------------------------------------------
    revocation:
      failure-mode: fail-closed
    # 允许的前端来源（CORS）。
    # 开发期 Vite dev server 监听 0.0.0.0，用 http://192.168.x.x:5273 访问时浏览器会携带
    # 该 Origin，并经 Vite 代理原样转发到后端（changeOrigin 只改 Host，不改 Origin）。
    # 若来源不在白名单，Spring CorsFilter 会直接返回 403 Invalid CORS request，
    # 前端会把它显示成「没有权限访问该资源」，容易误判为权限问题。
    # 生产环境请收敛为真实域名。
    cors:
      allowed-origin-patterns:
        - http://localhost:*
        - http://127.0.0.1:*
        - http://192.168.*:*
        - http://10.*:*
  data-init:
    # 固定随机种子，保证初始化数据分布稳定可复现
    enabled: true
    seed: 20260920

  # ---------------------------------------------------------------------
  # 业务知识层（RAG → 业务知识，REQ-RAG-02/03 与 REQ §6.4）
  #   真源：guarantee-ai/src/main/resources/knowledge/<domain>/*.md（随 jar 发布）
  #   运行期：启动时幂等导入 ai_knowledge_item；检索走 queryBusinessKnowledge 工具
  #
  #   enabled            **运维级应急开关**：false 时不注册检索工具（模型看不到它），
  #                      用于降级演练与故障应急。数字类问答完全不受影响；
  #                      与 DB 配置项 knowledge.enabled 取「与」——DB 是配置级开关
  #                      （页面可改、立即生效），yml 是进程级开关（DB 挂了也有效），
  #                      任一为 false 即关闭。分工见 AiToolRegistry 的注释。
  #   import-on-startup  false 时启动不导入真源（运维手工控制；不影响已有条目检索）。
  #   max-items          单次检索条数硬上限；与需求里的上限 5 取更小者。
  #   max-bytes          单次检索结果字节上限（默认 6KB，独立于工具结果 16KB 上限）。
  #   embedding.enabled  M3.5 向量检索预留，默认关闭（Q-RAG-01 拍板先走关键词/标签）。
  #
  #   ★ 第四阶段起，AI 的"运行期参数"以 DB 的 ai_config_item 为准（T4-01 接线）：
  #       预算（budget.*）、模型温度/名称（model.temperature/name）、工具组开关（tools.*）
  #       都在「系统管理 → AI 配置」页可改、**改完下一轮请求即生效**（无需重启）。
  #       AiConfigCatalog 是这些键的元数据唯一真源；上面 spring.ai.openai.*（api-key /
  #       base-url / chat.model / chat.temperature）是 Spring AI starter 的兜底与冷启动来源，
  #       数据库不可用时助手仍按这些值运行（AC-CFG-07）。
  #       本期未接线：model.max-tokens / model.timeout / model.max-retries
  #       （前者接了会把"改造前不发送 max_tokens"变成"发送 2048"，属行为变化）
  # ---------------------------------------------------------------------
  ai:
    knowledge:
      enabled: true
      import-on-startup: true
      max-items: 5
      max-bytes: 6144
      embedding:
        enabled: false

    # ---------------------------------------------------------------------
    # 观测底座（T5-01 / REQ-MCP-08/09）
    #   metrics-enabled      指标采集开关：置 false 后不再记新数据（故障应急用；
    #                        /actuator/prometheus 仍可抓取，只是曲线停更）。
    #   turn-metric-persist  单轮指标落库开关：一次问答一行（含失败与触顶）。
    #                        写失败**只告警不影响回答**（与审计相反）。
    #   成本口径（Q-MCP-05）：只报 token 与耗时，**没有货币成本**；
    #                        要报金额必须先有第四阶段的单价表（未排期）。
    #   标签纪律（AC-MCP-08）：只允许枚举维度（outcome/model/tool/status/source/direction/
    #                        domain/hit/result），**禁止** conversationId / userId / 问题文本。
    # ---------------------------------------------------------------------
    observability:
      metrics-enabled: true
      turn-metric-persist: true

    # ---------------------------------------------------------------------
    # 业务 MCP（T5-03 / REQ-MCP-05、§6.3）
    #   enabled      **总开关，默认 false**：未开启时后端不注册 MCP 接口（fail-closed），
    #                网关也会拒绝启动；平台自身不受影响（AC-MCP-06）。
    #   gateway-url  网关回连平台的地址（仅用于运维核对/日志，不参与鉴权）。
    #   qps-limit    每 token 的 QPS 上限；超限返回**可读错误**（不是 500）。
    #   daily-quota  每 token 每日调用上限。
    #   注意：机器凭据走 MCP Token（ai_mcp_token，明文不入库），**不走用户名密码**，
    #        服务账号也不适用"首登强制改密"闸门。
    #
    #   【开关边界（Lead 2026-09-30 裁决）】
    #   · 本开关是 **yml 级、需重启生效**：它只由 Spring 的 @ConditionalOnProperty 读取，
    #     不读第四阶段的 DB 配置项。这是刻意的——MCP 是**对外暴露面**，
    #     "改一行配置就把取数能力开到公网"的风险远大于"改配置要重启"的运维成本。
    #     （与 ai_config 里那些"页面可改、立即生效"的开关不是同一条路径。）
    #   · 关闭时**整套 MCP 相关接口一起不注册**：`/api/ai/mcp/**`（协议面）与
    #     `/api/system/mcp-tokens`（凭据管理面）都返回 404「路径不存在」。
    #     因此操作顺序是：**先开开关并重启 → 再签发凭据 → 最后把凭据给外部 Agent**。
    #     反过来（关闭状态下想先发一把凭据备用）在本版做不到，这是 fail-closed 的必然结果。
    # ---------------------------------------------------------------------
    mcp:
      enabled: false
      gateway-url: ""
      qps-limit: 5
      daily-quota: 10000

  # ---------------------------------------------------------------------
  # 逻辑删除（设计文档 §5.2 / 任务书 §4.1 的"开关"）
  #   true （默认）：LogicalDeleteInnerInterceptor 为受管表注入 is_deleted = 0
  #   false        ：关闭拦截器。**仅用于故障应急**——关闭后已删除数据会重新出现在
  #                  默认查询结果里（鉴权路径的显式过滤不依赖本开关，因此不会提权）。
  # ---------------------------------------------------------------------
  logical-delete:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        # T5-01（REQ-MCP-08）：prometheus 新暴露；health/info 行为不变（AC-MCP-13）。
        # metrics 一并暴露，便于用 /actuator/metrics 核对标签基数（AC-MCP-08）。
        include: health,info,metrics,prometheus
  metrics:
    tags:
      # 全局标签只放应用名：**不放** conversationId / userId / 问题文本（AC-MCP-08 基数控制）
      application: ${spring.application.name:guarantee-ai-admin}

logging:
  level:
    root: info
    com.guarantee: debug
    org.springframework.ai: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n"
